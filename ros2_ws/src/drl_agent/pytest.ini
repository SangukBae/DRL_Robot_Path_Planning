[pytest]
# ROS-free unit tests live under tests/. When pytest is run with NO path arg
# (from this package dir) testpaths scopes collection to tests/.
testpaths = tests
python_files = test_*.py
python_functions = test_*

# When pytest IS given an explicit path (e.g. from the repo root:
#   python3 -m pytest -q ros2_ws/src/drl_agent
# ) testpaths is ignored and pytest recurses into scripts/, where
# scripts/policy/test_tqc_agent.py and test_td7_agent.py live. Despite the
# "test_" prefix those are ROS2/Gazebo run/eval scripts (they import torch +
# rclpy and drive a live sim), NOT importable pytest units — collecting them
# errors out. norecursedirs (matched by directory BASENAME, so it applies
# regardless of the invoking cwd) keeps collection out of scripts/ and the
# colcon build artifacts; the --ignore-glob is a belt-and-suspenders guard in
# case a future ROS "test_*.py" lands outside scripts/.
norecursedirs = scripts launch build install log .git __pycache__
