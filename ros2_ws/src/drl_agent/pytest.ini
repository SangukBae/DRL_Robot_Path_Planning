[pytest]
# ROS-free unit tests live under tests/. When pytest is run with NO path arg
# (from this package dir) testpaths scopes collection to tests/.
testpaths = tests
python_files = test_*.py
python_functions = test_*

# When pytest IS given an explicit path (e.g. from the repo root:
#   python3 -m pytest -q ros2_ws/src/drl_agent
# ) testpaths is ignored and pytest recurses the whole package tree.
# norecursedirs (matched by directory BASENAME, so it applies regardless of
# the invoking cwd) keeps collection out of launch files and colcon build
# artifacts. The live-sim run modules (drl_agent/evaluation/live/) are
# deliberately named without a "test_" prefix so they are never mistaken for
# pytest units in the first place — no norecursedirs entry needed for them.
norecursedirs = launch build install log .git __pycache__
