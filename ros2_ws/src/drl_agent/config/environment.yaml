environment:
  # Robot training-start sampling region (non-structured baseline).
  lower: -9.0
  upper: 9.0
  # Goal / obstacle sampling region for the 25 x 25 m arena.
  # Walls are centered at +/-12.5 m (drl_arena.world); _arena_wall_* =
  # goal_obstacle_* +/- obstacle_wall_margin(1.0) = +/-12.5 lines up with them.
  goal_obstacle_lower: -11.5
  goal_obstacle_upper: 11.5
  # Dynamic obstacles removed from the code. To avoid silently changing the
  # non-curriculum baseline, this default stays static-only (num_of_humans: 0,
  # exactly as before minus the dynamic obstacles). Enable humans explicitly
  # (set num_of_humans > 0) only when a moving-obstacle scenario is intended.
  num_of_static_obstacles: 3
  num_of_humans: 0               # static-only default (humans opt-in)
  environment_state_dim: 80
  agent_state_dim: 7

  # AUX_PRED: privileged future-risk label generation (env side, training-only).
  # ENABLED here (matches the agent default). See environment_curriculum.yaml for
  # the full description. Keep num_sectors / horizons_sec in sync with the agent.
  # The v2 direct-head label blocks (ttc_head_enabled / hazard_sector_head_enabled
  # and their params) are NOT set here -> OFF (v1 label content). If the deployed
  # policy was trained with them ON, mirror those keys here AND in the agent.
  aux_prediction:
    enabled: true
    num_sectors: 16
    horizons_sec: [0.5, 1.0, 1.5]
    risk_distance_scale: 3.0
    min_speed_for_motion: 0.05
  # Observation time-context (actor-visible obs_state frame stacking). OFF here:
  # this non-curriculum config is also what real_policy_runner.py reads by
  # default, and DEPLOYMENT MUST MATCH TRAINING. If a policy was trained with
  # observation_time_context ON (see environment_curriculum.yaml), set the same
  # values here (or point the runner's env_config at the training config) — the
  # runner sizes the encoder/actor from this, and a mismatch is caught loudly when
  # the shared encoder fails to load. The TTC/hazard aux keys (ttc_head_enabled,
  # hazard_sector_head_enabled, ...) are likewise OFF here; mirror them too if the
  # deployed policy was trained with them on.
  observation_time_context:
    enabled: false
    obs_frame_stack: 1              # >=2 enables stacking (e.g. 4 = current + 3)
    stack_agent_state: false
  action_dim: 2
  agent_name: "hunter_se"
  max_action: 1.0
  # action[0]: waypoint distance r [m]  (robot frame, forward)
  # action[1]: waypoint angle theta [rad]  (robot frame, positive = left/CCW)
  actions_low:  [0.8, -0.524]   # r_min=0.8m, theta_min=-30° (-0.524 rad)
  actions_high: [2.0,  0.524]   # r_max=2.0m, theta_max=+30° (+0.524 rad)
  # theta 범위를 ±60° → ±30° 로 축소: Pure Pursuit 조향 포화 비율을 줄임
  # (r=1.2m 기준 포화 57% → 14%, r=1.6m 이상에서는 포화 없음)
  vehicle_wheelbase_m: 0.547696
  vehicle_steering_limit_deg: 21.58
  vehicle_min_speed_for_steering_mps: 0.15
  # Pure Pursuit local controller
  controller_cruise_speed_mps: 2.0   # nominal forward speed
  controller_min_speed_mps: 0.3      # speed floor at full steering
  controller_speed_steer_factor: 0.6 # speed reduction fraction at max steering
  spawn_z: 0.02
  obs_z_min_sensor_m: -0.455   # LiDAR frame: 0.045 m above ground (0.045-0.500)
  obs_z_max_sensor_m:  0.250   # LiDAR frame: 0.750 m above ground (0.750-0.500)

  # Obstacle catalog (relative to the config directory)
  obstacle_catalog: "drl_obstacle_assets"

  # Human proxy motion parameters (domain randomization).
  # Prediction-friendly profile: predictable over short horizons (~constant
  # velocity), mode changes only every few seconds, no reaction to the robot.
  # SOURCE OF TRUTH (scope):
  #   • The scalar base motion knobs below (accel, yaw rate/accel, retarget
  #     interval/prob, stop/pause, segment sec, jitter) and the behaviour-mode
  #     MIX (human_mode_weights) are read from here by environment.py.
  #   • The PER-MODE kinematics that DOMINATE actual human motion (waypoint
  #     distance, dir spread, stop/pause, speed scale, init wait per mode) live
  #     in code: Environment._HUMAN_MODE_DEFAULTS, overridable via human_mode_params.
  #     (human_waypoint_dist_* below is only a fallback for mode-less sampling.)
  human_update_rate: 20.0        # Hz — independent ROS timer rate for pedestrian kinematics
  # Default false = legacy wall-clock timer (byte-identical). See
  # environment_curriculum.yaml's human_deterministic_stepping comment.
  human_deterministic_stepping: false
  # Default false = legacy sleep-based physics advance. See
  # environment_curriculum.yaml's gazebo_deterministic_stepping comment.
  gazebo_deterministic_stepping: false
  gazebo_physics_step_size: 0.001
  gazebo_sensor_wait_timeout_sec: 1.5
  human_stop_prob_per_sec: 0.02  # weak stop/go
  human_pause_duration: 1.0      # seconds to stay stopped after a random stop
  human_heading_jitter_deg: 12.0 # heading perturbation, applied only at retarget [deg]
  human_retarget_prob_per_sec: 0.01  # rare spontaneous retarget
  human_heading_jitter_on_retarget_only: true  # one jitter per segment → no per-tick snap turns
  human_min_retarget_interval: 3.0   # min seconds between retargets (waypoint held ~2-4 s)
  human_desired_yaw_rate_limit: 0.7  # slow desired-heading change rate [rad/s]
  human_scan_dropout_prob: 0.03  # probability each LiDAR bin from a human is zeroed
  human_scan_noise_std: 0.05     # gaussian noise std added to human LiDAR returns [m]
  # Kinematic motion model limits (smooth, walking-scale → no teleport-like jerks)
  human_max_accel: 0.6           # max linear acceleration [m/s²]
  human_max_yaw_rate: 0.8        # max angular velocity [rad/s] (~46°/s)
  human_max_yaw_accel: 1.5       # max angular acceleration [rad/s²]
  human_k_yaw: 2.0               # proportional gain for yaw error → yaw rate command
  # Mode-transition control. human_waypoint_dist_* is a FALLBACK only — each
  # pedestrian uses its mode's per-mode wp_dist_* (Environment._HUMAN_MODE_DEFAULTS,
  # overridable via human_mode_params); these globals apply only to a waypoint
  # sampled without a mode. max_segment_sec force-retargets after that many
  # active-motion seconds (excludes pause/stop).
  human_waypoint_dist_min: 1.5   # m  (fallback; per-mode wp_dist_* governs humans)
  human_waypoint_dist_max: 3.5   # m  (fallback)
  human_max_segment_sec: 4.0     # s  (active-motion bound per segment; excludes pause/stop)
  # Falcon-lite goal-driven pedestrian motion (used only when num_of_humans > 0).
  # Each human walks toward an episode GOAL (decomposed into short local steps
  # along the goal direction), rests on arrival, then picks a new goal. The
  # travel style (mode above) sets the goal span/direction. Humans still NEVER
  # react to the robot, and motion stays near-constant-velocity between goals so
  # the constant-velocity aux labels remain valid. false -> legacy random walk.
  human_goal_driven_enabled: true
  human_goal_reach_threshold: 0.6   # m  within this of the goal -> rest + new goal
  human_goal_pause_duration: 2.0    # s  rest at a reached goal
  human_local_step_m: 2.0           # m  local step length toward the goal
  human_goal_span_multiplier: 2.0   # goal distance = (mode wp_dist_max) * this
  human_goal_min_span_m: 4.0        # m  floor on a newly sampled goal distance
  # Weak human-human local avoidance (lightweight, NOT full ORCA; robot ignored).
  # Nearby humans nudge each other's desired heading by a small capped amount so
  # they overlap less, without sharp turns (keeps motion aux-friendly).
  human_social_avoid_enabled: true
  human_social_avoid_radius: 1.5    # m  neighbour influence radius
  human_social_avoid_strength: 0.6  # blend weight of repulsion vs goal heading
  human_social_avoid_max_heading_offset_deg: 25.0  # cap on the avoidance nudge
  # Episode-level behaviour-mode mix (used only when num_of_humans > 0). Each
  # human keeps one mode for the episode; weights are normalised internally.
  human_mode_weights:
    crossing:   1.0
    along_path: 1.0
    waiting:    0.5
    slow_turn:  1.0

  # Start-pose heading/clearance safety (applied in _sample_train_start_pose)
  start_edge_heading_margin_m: 1.0   # wall proximity band where heading-toward-wall is rejected
  start_front_clearance_m: 1.2       # front cone clearance required from obstacles & walls
  start_front_fov_deg: 35.0          # half-angle of front cone [deg]

  # Spawn safety margins (metres)
  obstacle_wall_margin: 1.0    # min clearance between obstacle centre and arena wall
  obstacle_robot_margin: 1.5   # min clearance between obstacle and robot start
  obstacle_goal_margin: 1.5    # min clearance between obstacle and goal
  obstacle_mutual_margin: 1.2  # min clearance between two obstacle centres

  # Obstacle pool — pre-spawn once, teleport per episode (no delete/create per reset)
  use_obstacle_pool: true
  obstacle_pool_static_size: 3     # total static slots;  >= num_of_static_obstacles
  obstacle_pool_human_size: 8      # human proxy pool (visual+proxy pairs); >= num_of_humans
  # Parking slots: outside the 25 x 25 m walls (±12.5) but still on the 50x50
  # floor plane. Pool obstacles are always spawned on the ground, then either
  # activated in the arena or assigned to one of these parking slots via set_pose().
  parking_slot_xs: [-18.0, -16.0, -14.0, 14.0, 16.0, 18.0]
  parking_slot_ys: [-18.0, -16.0, -14.0, 14.0, 16.0, 18.0]
  parking_z: 0.0

threshold_parameters:
  goal_threshold: 0.42
  collision_threshold: 0.7
  time_delta: 0.1  # 10 Hz RL/environment step
  inter_entity_distance: 2.5
  lidar_max_range: 50

# ── Localization-error emulation (sim-to-real robustness) ────────────────────
# The policy's goal observation (goal_distance, heading_error) is computed from
# the localization-estimate pose with this noise applied; reward and done stay on
# ground-truth pose by default (use_gt_for_* below) for stable early training.
# Defaults below are OFF → identical to the original ground-truth behaviour.
localization:
  enabled: false              # master switch
  mode: "off"                 # label only (off/gaussian/drift/full); params drive behaviour
  sigma_xy_m: 0.0             # per-step Gaussian position noise std [m]
  sigma_yaw_rad: 0.0          # per-step Gaussian yaw noise std [rad]
  bias_xy_m: 0.0              # std of per-EPISODE constant position bias [m]
  bias_yaw_rad: 0.0           # std of per-EPISODE constant yaw bias [rad]
  random_walk_xy_mps: 0.0     # position drift random-walk rate [m/s]
  random_walk_yaw_rps: 0.0    # yaw drift random-walk rate [rad/s]
  delay_steps: 0              # localization latency in RL steps
  jump_prob: 0.0              # per-step probability of a pose jump
  jump_xy_m: 0.0              # max position jump magnitude [m]
  jump_yaw_rad: 0.0           # max yaw jump magnitude [rad]
  use_gt_for_reward: true     # reward uses ground-truth pose (recommended)
  use_gt_for_done: true       # goal-reached/done uses ground-truth pose (recommended)

use_zone_collision: false  # zones kept for monitoring; collision+reward both use rectangular region
zone_angles_deg: [-30, 30,   -50, -30,   30, 50,   -130, -50,  50, 130,  -150, -130, 130, 150,  150, -150]
zone_thresholds:  [0.68, 0.75, 0.75, 0.62, 0.62, 0.75, 0.75, 0.68] # monitoring only

# Rectangular Safety Region — Algorithm 1, "Unguided Self-exploration in Narrow Spaces
# with Safety Region Enhanced Reinforcement Learning for Ackermann-steering Robots"
# Hunter SE footprint for collision: use the LiDAR origin as the reference frame.
# Ouster is mounted at the robot longitudinal centre (x=0) and 0.50 m AGL.
# Front hard boundary includes the protruding front wheel envelope, not only
# the body box, so head-on wall contact is detected before the wheel clips.
#   front wheel edge from lidar = 0.339638 + 0.136 = 0.475638 m
#   rear body edge from lidar   = 0.410000 m
# Hard collision box is kept close to the physical footprint while staying above
# the hardware blind zone. Early warning begins at 1.2× the hard boundary.
# Hard collision box = 1.155638 m × 0.704 m
# Early warning box  = 1.386766 m × 0.8448 m
#
#  Direction │ blind-zone edge │ d_body │ margin │ threshold
#  ──────────┼─────────────────┼────────┼────────┼──────────
#  front     │ 0.300 m         │ 0.475638 │ 0.100 │ 0.575638 m
#  rear      │ 0.300 m         │ 0.410000 │ 0.030 │ 0.440000 m
#  left/right│ 0.300 m         │ 0.322  │ 0.030  │ 0.352 m
safety_region:
  d_front: 0.475638
  d_rear:  0.410000  # intentionally conservative; exceeds URDF collision rear extent
  d_left:  0.322
  d_right: 0.322
  margin_front: 0.10
  margin_rear:  0.03
  margin_left:  0.03
  margin_right: 0.03
  # Soft-boundary multipliers for reward proximity penalty.
  # Use a narrow band outside the hard boundary, following the paper's intent
  # to reduce over-coverage in narrow spaces.
  reward_warning_scale_front: 1.2
  reward_warning_scale_rear:  1.2
  reward_warning_scale_left:  1.2
  reward_warning_scale_right: 1.2
  scan_resolution: 0.05
