# Curriculum-learning settings for train_tqc_curriculum_agent.py.
# Only the curriculum_settings block is here; base train_settings are
# still read from train_tqc_config.yaml by the parent TrainTQC class.

curriculum_settings:
  enabled: true

  min_stage_steps: 30000
  min_stage_episodes: 20

  # Per-stage success / collision thresholds (list index = stage index).
  # Early stages require high success because the task is simple; later stages
  # allow lower success as the environment becomes genuinely harder.
  # List length should equal (num_stages - 1): one entry per promotable stage.
  # Curriculum is now 7 stages (0..6) → 6 promotable transitions (0→1 … 5→6).
  # curriculum_stage_logic clamps an out-of-range stage index to the LAST entry,
  # so a shorter list still runs without crashing.
  #   stage idx:               0     1     2     3     4     5
  pass_eval_success_rate:   [0.90, 0.88, 0.85, 0.80, 0.74, 0.70]
  pass_eval_collision_rate: [0.05, 0.08, 0.10, 0.13, 0.17, 0.20]

  # Quality gate (conservative): minimum SPL (Success weighted by Path Length)
  # required to PROMOTE, per stage. This stops "arrived but wandered" policies
  # from passing on success_rate alone. Values are deliberately mild (well below
  # a clean-run SPL) so they only catch clearly inefficient driving.
  # Empty list / 0.0 / omit → SPL gate disabled (legacy success-only behaviour).
  #   stage idx:     0     1     2     3     4     5
  pass_eval_spl:  [0.55, 0.55, 0.53, 0.50, 0.47, 0.45]

  # Optional extra gate (default OFF): minimum LiDAR clearance rate before
  # promotion. Leave empty to disable; raise to require safer-distance driving.
  # Kept off by default to introduce one quality metric (SPL) at a time.
  pass_eval_lidar_clearance_rate: []

  # How many consecutive evaluations must pass the threshold before promotion.
  # Set to 1 for faster iteration, 2-3 for more conservative advancement.
  consecutive_eval_passes: 2
