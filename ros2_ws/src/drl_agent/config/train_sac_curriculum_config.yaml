# Curriculum-learning settings for train_sac_curriculum_agent.py.
# Only the curriculum_settings block is here; base train_settings are
# still read from train_sac_config.yaml by the parent TrainSAC class.

curriculum_settings:
  enabled: true

  # Minimum steps/episodes spent in a stage before advancement is considered.
  # Prevents premature promotion if eval happens to hit a lucky streak early.
  min_stage_steps: 30000
  min_stage_episodes: 20

  # Per-stage success / collision thresholds (list index = stage index).
  # Early stages require high success because the task is simple; later stages
  # allow lower success as the environment becomes genuinely harder.
  # List length should equal (num_stages - 1): one entry per promotable stage.
  # 10-stage curriculum → 9 entries; matches train_tqc_curriculum_config.yaml (uniform promotion).
  pass_eval_success_rate:   [0.90, 0.88, 0.86, 0.80, 0.80, 0.76, 0.74, 0.72, 0.70]
  pass_eval_collision_rate: [0.10, 0.10, 0.10, 0.12, 0.12, 0.15, 0.20, 0.20, 0.20]

  # How many consecutive evaluations must pass the threshold before promotion.
  # Set to 1 for faster iteration, 2-3 for more conservative advancement.
  consecutive_eval_passes: 2

  # Replay-buffer reset + re-warmup on promotion INTO a contract-changing stage.
  # Stage 5 (add_clutter_clean) unseals the yield action, so clear the buffer and
  # refill it with on-contract data before gradient updates resume. Matches
  # train_tqc_curriculum_config.yaml so all baselines handle the boundary identically.
  reset_buffer_on_promote_to: [5]
  rewarmup_steps: 5000
