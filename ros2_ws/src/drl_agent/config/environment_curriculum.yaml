# Curriculum-learning environment config.
# Identical to environment.yaml except:
#   - Pool sizes are set to the maximum stage counts.
#   - num_of_* base values reflect final-stage maximums (overridden per-episode by stage).
#   - curriculum: block defines the 10 stages.
#
# Usage: pass as --ros-args -p config_file:=<path>/environment_curriculum.yaml
#        when launching environment_curriculum.py

environment:
  # ── Arena coordinate system (25 × 25 world, walls at ±12.5) ────────────────
  # MUST stay consistent with drl_arena.world: the env derives the physical wall
  # face as _arena_wall_* = goal_obstacle_* ± obstacle_wall_margin, so
  # goal_obstacle ±11.5 + obstacle_wall_margin 1.0 = ±12.5 = the SDF wall pose.
  # Legacy (non-structured) robot-start box; structured maps use band sampling.
  lower: -9.0
  upper: 9.0
  # Goal + obstacle sampling box (also the non-structured arena bounds).
  goal_obstacle_lower: -11.5
  goal_obstacle_upper: 11.5
  # Base counts = final-stage maximums. _apply_curriculum_stage() overrides these
  # each episode, so the yaml values only affect pool allocation at startup.
  # Dynamic obstacles have been removed from the code entirely: the only moving
  # obstacles are humans; static obstacles stay fixed.
  # Final-stage maximums after the 25x25 expansion (area ~2.16x the old 19x19).
  # static is capped by the corridor/intersection activatable-candidate ceiling
  # (~10: only small + medium-with-r<0.5 fit the 5.2 m lane), NOT raised further;
  # humans (small, lane-fitting) scale more freely.
  num_of_static_obstacles: 10      # pool sizing용 base 최대 static obstacle 수
  num_of_humans: 7                 # pool sizing용 base 최대 human 수
  environment_state_dim: 80        # policy가 보는 front-180 RL scan bin 수
  agent_state_dim: 7               # [goal_dist, heading, prev_action2, speed, yaw_rate, steering]

  # AUX_PRED: privileged future-risk label generation (env side, training-only).
  #   enabled=true  -> step()/reset() append a length (H*K + H) label after the
  #                    87-D state (risk map over H horizons x K sectors, then H
  #                    future min-distances).  The TQC trainer slices it off; the
  #                    87-D RL state is unchanged and inference never needs it.
  # Set this true together with hyperparameters_tqc.yaml aux_prediction.enabled.
  # num_sectors / horizons_sec MUST match the agent-side aux block.
  aux_prediction:
    enabled: true                   # master switch (env side)
    num_sectors: 16
    horizons_sec: [0.5, 1.0, 1.5]
    risk_distance_scale: 3.0        # D_c [m]: risk = clamp(1 - d/D_c, 0, 1)
    min_speed_for_motion: 0.05      # below this speed a human is treated static
    # --- direct dynamic-avoidance label blocks (append-only v2 wire) ----------
    # MUST match hyperparameters_tqc.yaml aux_prediction (ttc_*/hazard_*); the
    # agent fail-fasts on a mismatch via the wire header. Disabled -> the env
    # emits the v1 label CONTENT (risk_map + min_dist; the wire header is still v2
    # with ttc_len=hazard_len=0), so it is content-compatible / backward compatible.
    ttc_head_enabled: true          # emit normalized min time-to-contact target
    ttc_horizon_sec: 3.0            # TTC clamp horizon [s] (target normaliser)
    ttc_collision_radius: 0.5       # contact distance [m] (robot+human radius proxy)
    hazard_sector_head_enabled: true
    hazard_sector_bins: 3           # front / left / right (front-centred)
    hazard_distance: 3.0            # [m] a closing human within this flags its sector
  # ── Observation time-context (scan-history TRANSPORT for the temporal path) ──
  # Stacks the last N obs_state (front-180° 80-D RL scan) frames onto the state,
  # keeping the current 87-D frame FIRST (baseline-compatible indexing) and
  # appending older obs frames; the env reports the stacked state_dim via
  # get_dimensions. This is now the TRANSPORT that carries recent scan history to
  # the agent — the agent's temporal_actor_context (hyperparameters_tqc.yaml)
  # SPLITS it back into current(87) + scan-history and COMPRESSES the history into
  # a small temporal feature, so the raw 327-D stack no longer reaches the
  # actor/critic main path. (With temporal_actor_context OFF the agent would feed
  # this raw stack to the shared encoder — the deprecated, ablation-only path.)
  # obs_frame_stack MUST equal temporal_actor_context.history_len. Default OFF ->
  # 87-D state (byte-for-byte baseline). Also supersedes the aux-only temporal
  # branch (aux_prediction.temporal_enabled=false).
  observation_time_context:
    enabled: true
    obs_frame_stack: 4              # current + 3 history frames (80*4 + 7 = 327-D)
    stack_agent_state: false        # obs-only history; current agent_state kept once
  action_dim: 3                    # [waypoint distance r, waypoint angle theta, yield scalar]
  agent_name: "hunter_se"
  max_action: 1.0
  # STOP-CAPABLE ACTION/CONTROL CONTRACT — used from Stage 0 through the final
  # stage (the contract NEVER changes across the curriculum). The robot learns a
  # "car with brakes" from the very first stage: action[0]=0 commands a short
  # waypoint = creep/stop (combined with controller_low_speed_distance_m below),
  # so the policy always has genuine stop authority regardless of stage.
  #
  # Semantics note (vs. the older floor-0.8 contract): actions_low[0]=0.0 makes
  # pure_pursuit.action_to_waypoint (a linear map over actions_low/high) span
  # [0.0, 2.0] m instead of [0.8, 2.0] m, so the SAME normalized action points to
  # a different physical waypoint than under the old floor. Checkpoints / replay
  # buffers / reward curves from a floor-0.8 run are therefore NOT directly
  # comparable — train from scratch. Because every stage here uses the SAME
  # contract, there is no in-run action-semantics transition and no need to reset
  # the replay buffer or re-warmup at any stage boundary.
  #
  # ABLATION (whole-run, not per-stage): to reproduce the old brake-less car,
  # run a SEPARATE fresh training with actions_low[0]=0.8,
  # controller_min_speed_mps=0.3, controller_low_speed_distance_m=0.0,
  # yield_reward.enabled=false (byte-identical to the pre-stop contract) and
  # compare it head-to-head against this stop-capable run.
  # 3D HYBRID ACTION/CONTROL CONTRACT. Stop/yield is now a DEDICATED axis
  # (action[2]) instead of the old "short waypoint = implicit stop" ramp:
  #   action[0] = waypoint distance r   ∈ [actions_low[0], actions_high[0]] m
  #   action[1] = waypoint angle theta  ∈ [actions_low[1], actions_high[1]] rad
  #   action[2] = yield scalar          (>= yield_reward.action_threshold → yield)
  # In MOVE mode the controller floors r to controller_lookahead_min_m AND speed
  # to controller_v_move_min_mps, so the policy CANNOT stop unless it yields. In
  # YIELD mode speed is capped at controller_yield_creep_mps (0 → full stop).
  # action_dim went 2→3: checkpoints / replay buffers from a 2D run are NOT
  # compatible (actor/critic/buffer shapes differ) — train from scratch.
  actions_low:  [0.0, -0.524, -1.0]   # [r_floor, theta_min, yield_min]
  actions_high: [2.0,  0.524,  1.0]   # [r_max,   theta_max, yield_max]
  vehicle_wheelbase_m: 0.547696
  vehicle_steering_limit_deg: 21.58
  vehicle_min_speed_for_steering_mps: 0.15
  controller_cruise_speed_mps: 2.0
  controller_min_speed_mps: 0.0
  controller_speed_steer_factor: 0.6
  # Legacy implicit-stop ramp — unused on the 3D hybrid path (kept at 0.0).
  controller_low_speed_distance_m: 0.0
  # MOVE-mode floors (non-yield): the policy physically cannot stop here.
  controller_lookahead_min_m: 0.8      # r floored to this in MOVE mode [m]
  controller_v_move_min_mps: 0.35      # forward speed floored to this in MOVE mode [m/s]
  # YIELD-mode speed cap (0.0 → full stop allowed; raise for creep-only yields).
  controller_yield_creep_mps: 0.0
  spawn_z: 0.02                    # 로봇/오브젝트 초기 spawn z 오프셋
  obs_z_min_sensor_m: -0.455       # RL scan에 포함할 sensor-frame 최소 z
  obs_z_max_sensor_m:  0.250       # RL scan에 포함할 sensor-frame 최대 z

  obstacle_catalog: "drl_obstacle_assets" # obstacle/human asset catalog package 또는 yaml 이름

  human_update_rate: 20.0          # pedestrian kinematic update timer 주기 [Hz]
  # Prediction-friendly pedestrian motion (Auxiliary Prediction): predictable
  # over short horizons (~constant velocity), mode changes only every few
  # seconds, no reaction to the robot. Smooth (low accel/yaw), bounded waypoint
  # distance + segment timeout bound the mode-transition period, heading jitter
  # only at retarget, weak stop/go. Applies to both this curriculum config and
  # the non-curriculum environment.yaml path.
  #
  # SOURCE OF TRUTH (scope):
  #   • The scalar base motion knobs below (accel, yaw rate/accel, retarget
  #     interval/prob, stop/pause, segment sec, jitter) AND the behaviour-mode
  #     MIX (human_mode_weights) live here in YAML and are read by environment.py
  #     for BOTH the curriculum and non-curriculum paths.
  #   • The PER-MODE kinematics that DOMINATE actual human motion — waypoint
  #     distance, dir spread, stop/pause, speed scale, init wait for
  #     crossing/along_path/waiting/slow_turn — live in code:
  #     Environment._HUMAN_MODE_DEFAULTS. Override them only via human_mode_params
  #     (base block or per stage), not via the scalar keys here.
  #     (human_waypoint_dist_* below is only a FALLBACK for waypoints sampled
  #      without a mode; every human has a mode, so per-mode wp_dist_* wins.)
  #   • environment_curriculum.py hard-codes NO motion values: each stage is
  #     applied as (base above) + (that stage's overrides); omitting a key
  #     inherits the base. So edit base values here; add a key under a stage
  #     only to deviate for that stage.
  human_stop_prob_per_sec: 0.02   # weak stop/go
  human_pause_duration: 1.0
  human_heading_jitter_deg: 12.0  # applied only at retarget
  human_retarget_prob_per_sec: 0.01   # rare spontaneous retarget
  human_heading_jitter_on_retarget_only: true
  human_min_retarget_interval: 3.0    # waypoint held ~2-4 s
  human_desired_yaw_rate_limit: 0.7   # slow heading change
  human_scan_dropout_prob: 0.04   # final-stage value; overridden per stage
  human_scan_noise_std: 0.06      # final-stage value; overridden per stage
  human_max_accel: 0.6            # m/s²  (smooth speed changes)
  human_max_yaw_rate: 0.8         # rad/s (~46°/s walking turn)
  human_max_yaw_accel: 1.5        # rad/s²
  human_k_yaw: 2.0                # gentle yaw-error gain
  # Mode-transition control. human_waypoint_dist_* is a FALLBACK only — each
  # pedestrian uses its mode's per-mode wp_dist_* (Environment._HUMAN_MODE_DEFAULTS,
  # overridable via human_mode_params); these globals apply only to a waypoint
  # sampled without a mode. max_segment_sec force-retargets after that many
  # active-motion seconds (excludes pause/stop time).
  human_waypoint_dist_min: 1.5    # m  (fallback; per-mode wp_dist_* governs humans)
  human_waypoint_dist_max: 3.5    # m  (fallback)
  human_max_segment_sec: 4.0      # s  (active-motion bound per segment; excludes pause/stop)

  # Falcon-lite goal-driven pedestrian motion: each human travels toward an
  # episode GOAL (short local steps along the goal direction), rests on arrival,
  # then picks a new goal. The travel style (mode) sets goal span/direction.
  # Humans stay NON-reactive to the robot and near-constant-velocity between
  # goals (constant-velocity aux labels stay valid). The scalar knobs below are
  # stage-overridable (see HUMAN_MOTION_OVERRIDE_KEYS); the on/off toggles are
  # global. false -> legacy random waypoint walk.
  human_goal_driven_enabled: true  # human이 episode-level global goal을 따라 움직일지
  human_goal_reach_threshold: 0.6   # m  within this of the goal -> rest + new goal
  human_goal_pause_duration: 2.0    # s  rest at a reached goal
  human_local_step_m: 2.0           # m  local step length toward the goal
  human_goal_span_multiplier: 2.0   # goal distance = (mode wp_dist_max) * this
  human_goal_min_span_m: 4.0        # m  floor on a newly sampled goal distance
  # Weak human-human local avoidance (lightweight, robot ignored). A capped
  # heading nudge away from nearby humans -> less overlap, no sharp turns.
  human_social_avoid_enabled: true
  human_social_avoid_radius: 1.5    # m  neighbour influence radius (stage-overridable)
  human_social_avoid_strength: 0.6  # blend weight repulsion vs goal (stage-overridable)
  human_social_avoid_max_heading_offset_deg: 25.0  # cap on the avoidance nudge

  # ── PHASE1B: robot-reactive pedestrian (eval-only, default OFF) ─────────────
  # Symmetric extension of the human-human avoidance above: when enabled, humans
  # ALSO repel from the robot's GT pose (human_motion_manager._social_avoidance_
  # offset). human_robot_avoid_enabled is exposed as a LIVE ROS parameter (not
  # just this YAML default) so an eval script can flip it on/off without
  # restarting Gazebo -- see environment.py's declare_parameter comment.
  # Training NEVER sets this true, so Falcon-lite pedestrians stay non-reactive
  # to the robot (required for the aux constant-velocity labels to stay valid)
  # unless this "robot-reactive" eval preset is explicitly requested.
  human_robot_avoid_enabled: false
  human_robot_avoid_radius: 2.0     # m  robot influence radius
  human_robot_avoid_strength: 0.6   # blend weight repulsion vs goal
  human_robot_avoid_max_heading_offset_deg: 25.0  # cap on the avoidance nudge

  # ── PHASE1B: hard-pedestrian eval preset (eval-only, default OFF) ───────────
  # Reuses the EXISTING mode vocabulary (crossing/along_path/waiting/slow_turn)
  # re-weighted toward direction-change/stop-heavy behaviour, instead of adding
  # a new pedestrian AI. Applied for one episode's spawn only when BOTH
  # hard_pedestrian_eval_enabled (a live ROS param, default false) and
  # curriculum_eval_mode are true -- see environment.py::_apply_hard_pedestrian_
  # eval_override. human_mode_params here is deep-merged onto the base
  # _HUMAN_MODE_DEFAULTS per mode (same contract as the per-stage
  # human_mode_params override), so only the listed knobs change.
  hard_pedestrian_eval:
    human_mode_weights: {crossing: 0.5, along_path: 0.5, waiting: 1.0, slow_turn: 1.5}
    human_mode_params:
      slow_turn:  {stop_prob: 0.03, dir_spread_deg: 70.0}
      waiting:    {stop_prob: 0.15, dir_spread_deg: 75.0}

  # ── Human-only DYNAMIC-RISK reward shaping (reward_calculator) ─────────────
  # A pedestrian-specific collision-risk penalty, SEPARATE from the static
  # obstacle-proximity penalty (w_obs). Computed from privileged GT robot+human
  # kinematics (training-time shaping), so it can reward direction-/closing-aware
  # caution a single nearest-distance reading cannot. Three additive terms,
  # aggregated over the SINGLE most-dangerous human (bounded regardless of crowd
  # size). The penalty is exactly 0 when no humans are active, so the human-free
  # stages 0-2 are unaffected. Defaults are conservative so existing driving is
  # not disrupted; raise the weights to push harder on social safety.
  # OPT-IN: the code defaults this OFF when the whole block is absent (so older /
  # external configs are byte-for-byte unchanged); this curriculum config turns it
  # ON explicitly below.
  human_risk_penalty:
    enabled: true
    w_personal_space: 0.4        # weight on max(0, 1 - d/d_ps)^2 inside d_ps
    personal_space_radius_m: 1.0 # d_ps: personal-space radius [m]
    w_approach_rate: 0.25        # weight on clamp(closing/v_ref, 0, 1) while closing
    approach_radius_m: 2.0       # d_app: approach term only applies within this [m]
    approach_v_ref_mps: 1.0      # v_ref: closing-speed normaliser [m/s]
    w_ttc: 0.3                   # weight on max(0, 1 - ttc/ttc_safe)^2
    ttc_safe_s: 2.0              # ttc_safe: TTC term only when closing & ttc < this [s]

  # ── Stop/Yield reward shaping (reward_calculator) ──────────────────────────
  # Layered ON TOP of human_risk_penalty to teach "stop only when a human
  # collision is imminent, then move again". The WHOLE block is HARD-GATED on a
  # human being present this step (finite nearest-human distance), so it is
  # exactly 0 in human-free stages/timesteps — INCLUDING the idle penalty
  # (C) — leaving curriculum stages 0-2 unaffected (their only keep-moving
  # pressure stays the un-relieved step penalty, as before). Three bounded
  # effects when a human IS present:
  #   (A) step_penalty_relief_scale: shrink the per-step time penalty while the
  #       most-imminent human is a closing hazard (TTC / closing-rate gate), so
  #       waiting one out is not punished.
  #   (B) w_yield_bonus: a small positive bonus for slowing/stopping, scaled by
  #       how slow AND how risky (capped by max_yield_bonus). Paid only while the
  #       hazard gate is active — never when a present human is non-threatening.
  #   (C) w_idle_penalty: a small penalty for idling (|speed| < threshold) when a
  #       human is present but NOT an imminent hazard, so the policy does not
  #       collapse to "always stop" around people.
  # Needs the stop-capable controller above to have anything to reward.
  # OPT-IN: absent block / enabled:false → reward byte-identical (ablation).
  yield_reward:
    enabled: true                  # stop-capable (brake-less ablation: false)
    # 3D-action yield channel (controller): honour action[2] and the threshold at
    # which it flips to yield. Stages seal it (action_enabled:false) early on.
    action_enabled: true           # global default; early stages override to false
    action_threshold: 0.3          # action[2] (raw [-1,1]) >= this → yield (deadzone)
    risk_gate_ttc_s: 2.0            # risk-active when min time-to-contact < this
    risk_gate_approach: 0.15        # OR when normalised closing rate > this
    # No positive "valid yield" bonus: yielding is never itself rewarded — a
    # legitimate (risk_active) yield only gets the step-penalty relief. Yielding
    # while SAFE (risk_low) is penalised (w_bad_yield); long yields escalate.
    w_yield_bonus: 0.0              # slow-down bonus OFF (was 0.01)
    max_yield_bonus: 0.0
    w_idle_penalty: 0.07            # gain on the idle (loitering) penalty
    idle_speed_threshold_mps: 0.1   # "idle" = |speed| below this [m/s]
    step_penalty_relief_scale: 0.6  # multiply step_pen while risk-active (0.6 = 40% relief)
    w_bad_yield: 0.15               # penalty for yielding while it is SAFE (risk_low)
    yield_streak_grace: 8           # yields shorter than this (steps) are not escalated
    yield_streak_grow_w: 0.01       # per-step escalation once the grace streak is passed

  # ── Generic low-progress (stall) penalty — NOT human-gated ──────────────────
  # The human-gated yield/anti-freeze above cannot see human-free stalls. This
  # fires whenever it is SAFE (no human hazard AND rect_proximity < static_risk_thr)
  # yet the robot makes no progress at low speed — a small, constant mid-episode
  # time cost that complements the terminal timeout penalty. OPT-IN.
  stall:
    enabled: true
    w_penalty: 0.02             # per-step penalty while safely stalled
    progress_eps: 0.0           # "no progress" = clipped progress <= this
    speed_threshold_mps: 0.15   # "low speed" = |speed| below this [m/s]
    static_risk_thr: 0.2        # "low static risk" = rect_proximity below this

  # ── Anti-freeze penalty (reward_calculator) ────────────────────────────────
  # Targets the freeze→timeout failure mode WITHOUT punishing a legitimate brief
  # yield. Fires ONLY when ALL hold, for min_freeze_steps CONSECUTIVE steps:
  #   • a human hazard is active (same risk gate as yield_reward), AND
  #   • |speed| < speed_threshold_mps (nearly stopped / creeping), AND
  #   • progress <= 0 (goal distance not decreasing).
  # A short stop resets its counter before the streak is reached, so yielding is
  # untouched; only a SUSTAINED, no-progress hold is penalised. Human-free steps,
  # normal forward driving, and normal avoidance never trigger it.
  # OPT-IN: absent block / enabled:false → reward byte-identical (ablation).
  anti_freeze:
    enabled: true
    speed_threshold_mps: 0.12   # "frozen" = |speed| below this [m/s]
    min_freeze_steps: 12        # consecutive freeze steps before the penalty starts
    w_penalty: 0.02             # small per-step penalty once the streak is exceeded

  # Episode-level pedestrian behaviour-mode mix. Each human is assigned ONE mode
  # at spawn and keeps it for the episode. Weights need not sum to 1 (normalised
  # internally); empty/absent → uniform. Per-mode kinematics live in code
  # (Environment._HUMAN_MODE_DEFAULTS) and may be overridden via human_mode_params.
  # Stages below may override human_mode_weights to reshape the mix.
  human_mode_weights:
    crossing:   1.0
    along_path: 1.0
    waiting:    0.5
    slow_turn:  1.0

  start_edge_heading_margin_m: 1.0
  start_front_clearance_m: 1.2
  start_front_fov_deg: 35.0

  # ── Open-map (lobby / clutter) inward-safe start yaw ─────────────────────────
  # corridor/intersection get structurally safe lane-aligned spawn yaw, but the
  # open maps (lobby/clutter) had no start_regions so yaw was ~random; a spawn
  # near an outer wall then often faced the wall and failed in the first steps.
  # This samples the open-map start yaw inside the INWARD-admissible sector when
  # near a wall (full random diversity when far), so "facing the wall" starts are
  # removed without homogenising every open-map yaw. Distinct from
  # start_edge_heading_margin_m, which only REJECTS bad yaw post-hoc; this picks a
  # safe yaw up front (and reuses that same margin by default). OFF → legacy.
  open_map_safe_start_yaw_enabled: true
  open_map_safe_yaw_wall_margin_m: 0.0       # <=0 → reuse start_edge_heading_margin_m
  open_map_safe_yaw_edge_margin_deg: 10.0    # buffer from wall-parallel headings
  open_map_safe_yaw_fallback_halfwidth_deg: 25.0  # degenerate-sector fallback half-width

  obstacle_wall_margin: 1.0
  obstacle_robot_margin: 2.82
  obstacle_goal_margin: 1.5
  obstacle_mutual_margin: 1.2

  use_obstacle_pool: true
  # NOTE (structured map curriculum): when map_layout_enabled=true the env
  # OVERRIDES obstacle_pool_static_size with the group-aware coverage size so
  # every (map_type, size_group) has >= map_static_coverage_per_group entries
  # pre-spawned (see _build_static_pool_coverage). The value below is only the
  # fallback used when the curriculum is disabled.
  obstacle_pool_static_size: 24   # fallback; layout coverage usually grows this
  obstacle_pool_human_size: 8     # >= max active_humans across all stages (7) + margin
  # Parking slots must sit OUTSIDE the 25x25 arena (walls at +-12.5). Every coord
  # is >= 14 so each slot clears the wall by >= 1.5 m; the env auto-extends this
  # ring (_ensure_parking_slots) if the (coverage-grown) pool needs more slots,
  # dropping any slot that would fall inside the enlarged arena.
  parking_slot_xs: [-18.0, -16.0, -14.0, 14.0, 16.0, 18.0]
  parking_slot_ys: [-18.0, -16.0, -14.0, 14.0, 16.0, 18.0]
  parking_z: 0.0

  # ── Structured map curriculum (docs/map_curriculum_plan.md) ────────────────
  # "안 A" (world expansion) is now IMPLEMENTED: drl_arena.world is 25x25 (walls
  # at ±12.5) and the structured layouts fill it. lobby uses the full 25x25;
  # corridor/intersection keep a FIXED lane width (5.2) and only grow in length;
  # clutter walls scale with span. All extents derive from map_inner_* so the
  # arena size lives in exactly two coupled places: this config + drl_arena.world.
  map_layout_enabled: true
  # Arena wall CENTRELINE (= the 25x25 world walls at ±12.5). NOT the navigable
  # boundary: _build_map_layouts derives the navigable inner face by subtracting
  # (½ wall thickness + map_wall_clearance), so structured start/goal/obstacle/
  # human poses keep clear of the OUTER world walls (which are not in any layout's
  # internal-wall list). Used as-is only for parking exclusion + the arena size.
  map_inner_lower: -12.5
  map_inner_upper: 12.5
  map_wall_thickness: 0.30
  map_wall_height: 1.20
  # 3.5 m made the off-lane side bands infeasible once reserved_passage,
  # wall_clearance and real obstacle radii were all applied, so structured
  # corridor/intersection episodes degenerated into empty lanes. 5.2 m keeps
  # the central passage clear while still allowing the current small/medium
  # curriculum obstacles (and humans) to fit in the side bands.
  map_corridor_width: 5.2
  map_intersection_width: 5.2
  # Lobby central open-area half-extent. Grown 4.0 -> 6.0 with the 25x25 arena so
  # the open crossing space stays ~proportional (open_half / inner_half ≈ 0.48);
  # LARGE items keep settling on the perimeter instead of the centre.
  map_lobby_open_half_extent: 6.0
  map_large_footprint_margin: 2.0   # extra lobby open-area keep-out for LARGE items
                                    # (catalog radius underestimates real footprint)
  map_wall_clearance: 0.55        # min clearance any sampled pose keeps off a wall
  map_static_coverage_per_group: 7  # pre-spawn >= this per (map_type, size_group);
                                    # raised 5->7 so the corridor/intersection
                                    # candidate ceiling reaches ~10 (their catalog
                                    # limit) and big maps get more variety.
  # ── Structured spawn policy (corridor / intersection only) ─────────────────
  # Robot starts inside an end/arm band (never mid-lane), heads down the lane,
  # and a central passage strip is always kept clear of static obstacles so the
  # lane stays traversable. Other maps (lobby/clutter) are unaffected.
  map_start_band_depth: 2.5          # end/arm band depth along the lane axis [m]
  map_start_side_margin: 0.4         # extra clearance off the lane side walls [m]
  map_spawn_yaw_center_bias_deg: 12.0  # inward yaw tilt that grows toward the wall
  map_spawn_yaw_jitter_deg: 8.0      # small extra inward yaw jitter
  map_corridor_passage_width: 1.6    # reserved central lane width (corridor) [m]
  map_intersection_passage_width: 1.6  # reserved cross-lane width (intersection) [m]
  map_passage_safety_margin: 0.25    # extra keep-out added to obstacle radius [m]

threshold_parameters:
  goal_threshold: 0.42
  collision_threshold: 0.7
  time_delta: 0.1
  inter_entity_distance: 2.5       # start/goal/obstacle/human sampling 시 기본 이격 기준
  lidar_max_range: 50              # RL scan / environment_state clipping 최대 거리 [m]

# ── Localization-error emulation (sim-to-real) ───────────────────────────────
# Base = OFF (identical to ground truth). Curriculum stages ramp it up via a
# per-stage `localization:` block (see stages below). Reward/done stay on
# ground-truth pose; only the policy's goal observation is corrupted.
#
# Error model (environment.py _loc_emulator_step): bias + time-correlated OU
# measurement error + per-second drift + latency + rare jumps, scaled per
# structured-map type. Notes:
#   • sigma_xy_m / sigma_yaw_rad   = STATIONARY std of the OU measurement error.
#   • corr_time_xy_s / *_yaw_s     = OU correlation time [s]. 0 → white noise
#                                    (legacy). ~0.5–1.5 s ≈ filtered AMCL/SLAM.
#   • random_walk_*_mps / *_rps    = PER-SECOND drift intensity (accumulated std
#                                    ≈ rate·√t; Brownian √dt scaling).
#   • map_type_multipliers         = base × multiplier per structured map type.
#       corridor uses along_axis: x (corridor runs along world-x) so the
#       ALONG-corridor position + drift get along_extra on top of sigma_xy —
#       the real aperture-problem failure mode in long corridors.
#   • big_jump_* / yaw_flip_*      = rare large relocalization / mirror-flip
#                                    (corridor only); enable on hard stages only.
# Any omitted key inherits this base; a stage's `localization:` block is merged
# on top (deep-restored each stage, so no cross-stage leakage).
localization:
  enabled: false                   # localization noise master switch
  mode: "off"                      # noise 모드 label(off/gaussian/drift/full)
  sigma_xy_m: 0.0                  # 위치 관측 OU stationary std [m]
  sigma_yaw_rad: 0.0               # yaw 관측 OU stationary std [rad]
  corr_time_xy_s: 0.0        # 0 → white noise (backward compatible)
  corr_time_yaw_s: 0.0             # yaw noise correlation time [s]
  bias_xy_m: 0.0                   # episode 전체에 유지되는 위치 bias std [m]
  bias_yaw_rad: 0.0                # episode 전체에 유지되는 yaw bias std [rad]
  random_walk_xy_mps: 0.0    # per-second drift intensity (std ≈ rate·√t)
  random_walk_yaw_rps: 0.0
  delay_steps: 0                   # goal observation에 적용할 localization latency step
  jump_prob: 0.0                   # 작은 relocalization jump의 step당 발생 확률
  jump_xy_m: 0.0                   # 작은 jump의 xy 최대 크기 [m]
  jump_yaw_rad: 0.0                # 작은 jump의 yaw 최대 크기 [rad]
  big_jump_prob: 0.0         # large relocalization failure (hard stages only)
  big_jump_xy_m: 0.0               # 큰 relocalization failure jump xy 크기 [m]
  big_jump_yaw_rad: 0.0            # 큰 relocalization failure jump yaw 크기 [rad]
  yaw_flip_prob: 0.0         # ±π flip in symmetric maps (corridor)
  yaw_flip_map_types: ["corridor"]
  # Per-map-type scaling. corridor localizes worst (long featureless lane) →
  # larger + anisotropic along the corridor (world-x) axis.
  map_type_multipliers:
    corridor:     {sigma_xy: 1.6, sigma_yaw: 2.0, drift: 2.0, jump: 1.5, along_axis: x, along_extra: 1.8}
    intersection: {sigma_xy: 1.3, sigma_yaw: 1.5, drift: 1.5, jump: 1.2}
    clutter:      {sigma_xy: 1.1, sigma_yaw: 1.1, drift: 1.1, jump: 1.0}
    lobby:        {sigma_xy: 1.0, sigma_yaw: 1.0, drift: 1.0, jump: 1.0}
  use_gt_for_reward: true          # reward 계산은 noisy pose 대신 ground truth pose 사용
  use_gt_for_done: true            # goal reached / done 판정도 ground truth pose 사용

# ── Named goal-obs (localization-uncertainty) noise PROFILES ─────────────────
# A stage selects one with `localization_profile: <name>` (see stages). The
# profile is DEEP-merged onto the base `localization:` block above, so it
# INHERITS map_type_multipliers / use_gt_* and only overrides the listed knobs.
# Inline per-stage `localization: {...}` still works and is applied ON TOP.
# Param names are physical and map 1:1 to real localization logs:
#   sigma_xy_m / sigma_yaw_rad   = OU stationary std (corr_time_*_s = correlation)
#   drift_xy_mps / drift_yaw_radps = per-second drift intensity (alias: random_walk_*)
#   bias_xy_m / bias_yaw_rad, jump_prob / jump_xy_m / jump_yaw_rad, delay_steps
# Train profiles stay conservative; the aggressive failure cases (yaw flip,
# strong jump/delay) live ONLY in `stress_eval`, which no training stage uses.
localization_profiles:
  clean: {enabled: false}
  weak_goal_noise:            # Stage 2: weak correlated goal-obs noise + 1-step delay
    enabled: true
    mode: gaussian                 # OU-correlated 관측 오차만 사용하는 약한 noise profile
    sigma_xy_m: 0.05               # weak profile 위치 std [m]
    sigma_yaw_rad: 0.02            # weak profile yaw std [rad]
    corr_time_xy_s: 0.8            # weak profile 위치 correlation [s]
    corr_time_yaw_s: 0.8           # weak profile yaw correlation [s]
    delay_steps: 1                 # weak profile localization delay
  drift_goal_noise:           # Stage 3: + per-second drift + weak bias + 2-step delay
    enabled: true
    mode: drift                    # gaussian + drift + bias가 포함된 중간 난도 profile
    sigma_xy_m: 0.08
    sigma_yaw_rad: 0.03
    corr_time_xy_s: 1.0
    corr_time_yaw_s: 1.0
    drift_xy_mps: 0.02             # 위치 drift 강도 [m/sqrt(s)]에 해당하는 rate
    drift_yaw_radps: 0.01          # yaw drift 강도 [rad/sqrt(s)]에 해당하는 rate
    bias_xy_m: 0.03
    bias_yaw_rad: 0.01
    delay_steps: 2
  robustness_train:           # Stage 4: full + bias + RARE small/big jump (NO flip)
    enabled: true
    mode: full                     # bias/drift/delay/jump가 모두 들어간 학습용 강한 profile
    sigma_xy_m: 0.10
    sigma_yaw_rad: 0.04
    corr_time_xy_s: 1.2
    corr_time_yaw_s: 1.2
    bias_xy_m: 0.05
    bias_yaw_rad: 0.02
    drift_xy_mps: 0.03
    drift_yaw_radps: 0.015
    delay_steps: 3
    jump_prob: 0.002
    jump_xy_m: 0.3
    jump_yaw_rad: 0.1
    big_jump_prob: 0.0005
    big_jump_xy_m: 0.8
    big_jump_yaw_rad: 0.4
  stress_eval:                # EVALUATION-ONLY stress profile (no training stage uses it):
    enabled: true             #   stronger jump/delay + ±π yaw flip (corridor).
    mode: full                     # 학습에는 안 쓰는 eval-only stress profile
    sigma_xy_m: 0.12
    sigma_yaw_rad: 0.05
    corr_time_xy_s: 1.2
    corr_time_yaw_s: 1.2
    bias_xy_m: 0.08
    bias_yaw_rad: 0.03
    drift_xy_mps: 0.05
    drift_yaw_radps: 0.02
    delay_steps: 5
    jump_prob: 0.01
    jump_xy_m: 0.5
    jump_yaw_rad: 0.2
    big_jump_prob: 0.003
    big_jump_xy_m: 1.0
    big_jump_yaw_rad: 0.6
    noise_flip_enabled: true   # yaw flip ENABLED only here (stress eval)
    yaw_flip_prob: 0.002

# ── Proprioception observation noise (separate axis; base = OFF) ─────────────
# Perturbs only the observed speed / yaw-rate / steering slots (state[84:87]).
# Reward/done/collision use ground truth. Physical-unit params.
proprio_noise:
  enabled: false                  # proprio observation noise master switch
  speed_sigma_mps: 0.0            # observed speed gaussian std [m/s]
  speed_bias_mps: 0.0             # observed speed bias [m/s]
  speed_scale_sigma: 0.0          # observed speed multiplicative scale noise std
  yaw_rate_sigma_radps: 0.0       # observed yaw-rate gaussian std [rad/s]
  yaw_rate_bias_radps: 0.0        # observed yaw-rate bias [rad/s]
  steer_sigma_rad: 0.0            # observed steering gaussian std [rad]
  delay_steps: 0                  # proprio observation latency step
proprio_noise_profiles:
  clean: {enabled: false}         # proprio noise 없음
  light:                      # Stage 3: very weak proprio noise
    enabled: true                 # 약한 proprio noise profile 사용
    speed_sigma_mps: 0.02
    yaw_rate_sigma_radps: 0.02
    speed_scale_sigma: 0.01
  medium:                     # Stage 4: slightly stronger + bias + 1-step delay
    enabled: true                 # 중간 proprio noise profile 사용
    speed_sigma_mps: 0.04
    speed_bias_mps: 0.02
    yaw_rate_sigma_radps: 0.04
    yaw_rate_bias_radps: 0.01
    speed_scale_sigma: 0.02
    steer_sigma_rad: 0.01
    delay_steps: 1

# ── Run-level logging / evaluation config (NOT per-stage) ────────────────────
# Responsibility split: the curriculum only chooses a NOISE PROFILE per stage;
# WHAT to log and WHICH profile to evaluate with are run-level (constant across
# stages). Structure + defaults below are an extension point — the trainer can
# read them later without touching stage logic. Keeping them here (not in
# stages) guarantees logging columns never change between stages.
localization_logging:
  log_gt_goal_metrics: true        # always log ground-truth goal metrics
  log_noisy_goal_metrics: true     # and the noisy (observed) goal metrics
  log_localization_error: false    # |loc_est - gt| per step (extension point)
  log_jump_events: false           # mark jump/flip occurrences (extension point)
evaluation:
  eval_use_same_localization_noise: true  # true면 현 stage profile로 eval, false면 아래 named profile 사용
  eval_noise_profile: ""                  # 비우면 current stage profile, 값이 있으면 named profile 강제

use_zone_collision: false         # 구형 zone collision 로직 사용 여부(현재는 false 권장)
zone_angles_deg: [-30, 30,   -50, -30,   30, 50,   -130, -50,  50, 130,  -150, -130, 130, 150,  150, -150] # zone collision 감시 구간 각도쌍 [deg]
zone_thresholds:  [0.68, 0.75, 0.75, 0.62, 0.62, 0.75, 0.75, 0.68] # 각 zone의 충돌 임계거리 [m]

safety_region:
  d_front: 0.475638               # LiDAR 원점 기준 전방 hard collision box 반길이 [m]
  d_rear:  0.410000               # 후방 hard collision box 반길이 [m]
  d_left:  0.322                  # 좌측 hard collision box 반너비 [m]
  d_right: 0.322                  # 우측 hard collision box 반너비 [m]
  margin_front: 0.10              # 전방 hard box에 더할 안전 margin [m]
  margin_rear:  0.03              # 후방 hard box에 더할 안전 margin [m]
  margin_left:  0.03              # 좌측 hard box에 더할 안전 margin [m]
  margin_right: 0.03              # 우측 hard box에 더할 안전 margin [m]
  reward_warning_scale_front: 1.2 # reward용 soft warning box 전방 확장 배율
  reward_warning_scale_rear:  1.2 # reward용 soft warning box 후방 확장 배율
  reward_warning_scale_left:  1.2 # reward용 soft warning box 좌측 확장 배율
  reward_warning_scale_right: 1.2 # reward용 soft warning box 우측 확장 배율
  scan_resolution: 0.05           # box rasterization / scan-based safety 계산 해상도 [m]

# ──────────────────────────────────────────────────────────────────────────────
# Curriculum stage definitions
# Fields overridden per episode by _apply_curriculum_stage():
#   active_static, active_humans                   → 이번 episode에서 실제 활성화할 static/human 수
#   active_static_by_map, active_humans_by_map     → map_type별 활성 수 override
#   allowed_map_types, eval_map_types              → train/eval에 사용할 structured map 종류
#   map_type_probs                                 → allowed_map_types sampling weight
#   allowed_static_groups                          → small/medium/large obstacle size filter
#   human_mode_weights                             → crossing/along_path/waiting/slow_turn 비율
#   localization_profile, proprio_noise_profile    → named noise profile selector
#   human_scan_noise_std, human_scan_dropout_prob  → 사람 LiDAR return 노이즈 세기
# (Dynamic obstacles removed: active_dynamic / dynamic_speed_* are no longer used.)
# Fields absent in a stage inherit the base environment values above.
# ──────────────────────────────────────────────────────────────────────────────
curriculum:
  enabled: true                  # environment가 curriculum stage override를 사용할지
  initial_stage: 0               # 시작 stage index; trainer가 curriculum_stage param으로 갱신

  # Curriculum design (10 stages). ONE major axis changes per stage so training
  # stays stable. Crucially, DYNAMIC-OBSTACLE (human) avoidance and OBSERVATION
  # (localization / proprioception) robustness are now learned on SEPARATE stages
  # so the credit-assignment signal for each is clean (vs. the old layout that
  # bundled "first human + loc-noise" into one stage and "clutter + proprio-noise"
  # into another). Mixed-map stages use active_static_by_map / active_humans_by_map
  # so the NARROW corridor gets fewer obstacles/humans than the roomier
  # intersection / clutter / lobby IN THE SAME STAGE — corridor's activatable
  # static candidate ceiling is ~10 (only small + medium-with-r<0.5 fit the 5.2 m
  # lane) and physical packing is tighter still. Stages without a by-map dict keep
  # the single active_static / active_humans (backward compatible).
  # Per-axis intent. Stages 3-6 are STRICTLY single-axis (exactly one new variable
  # vs. the previous stage) so each robustness skill has a clean credit-assignment
  # signal; stages 7-9 are INTEGRATION stages that scale several axes at once on
  # purpose (their role is generalization, not isolation). The old single big
  # integration stage (7) was SPLIT into 7 (+lobby/scan-noise/modest crowd) and
  # 8 (+crowd scale/drift loc-noise/richer modes). 6→7 is REDUCED but not fully
  # single-axis: it still adds lobby + first human-scan noise + crowd 1→3 together
  # (loc/proprio/modes held), which is far lighter than the old 4-axis jump.
  # The stop-capable action/control contract is fixed from Stage 0 onward, so no
  # stage changes action semantics — Stage 3 only ADDS the first human, it is not
  # a contract boundary (no buffer reset / re-warmup anywhere).
  #   0 base (empty) · 1 corridor static · 2 +intersection (structure) ·
  #   3 +humans (count 1, simplest modes), CLEAN obs — dynamic-avoidance only ·
  #   4 SAME humans as 3 + weak loc-noise — localization robustness only ·
  #   5 +clutter terrain; humans/modes/all-noise UNCHANGED from 4 — terrain only ·
  #   6 SAME map/humans/scan as 5 + light proprio-noise — proprio robustness only ·
  #   7 +lobby (4th map) + FIRST human-scan noise + modest crowd (1->3); loc/proprio
  #     and human modes UNCHANGED from 6 — perception/new-map axis ·
  #   8 INTEGRATION: scale crowd (3->5) + richer modes + drift loc-noise ·
  #   9 final integration (full crowd + strongest TRAIN noise).
  stages:
    # ── Stage 0: lobby, empty — basic goal reaching ─────────────────────
    # map_type per stage: structured map curriculum samples a map each episode
    # from allowed_map_types (weighted by map_type_probs). allowed_static_groups
    # is a SIZE filter (small/medium/large). human_placement_mode is derived from
    # the map structure automatically (lobby->lobby_crossings, etc.).
    - name: empty
      yield_reward: {action_enabled: false}   # yield 봉인 (정지 불가, 순수 주행)
      active_static: 0            # 이번 stage의 기본 static obstacle 수
      active_humans: 0            # 이번 stage의 기본 human 수
      human_scan_noise_std: 0.0   # human LiDAR return gaussian noise std
      human_scan_dropout_prob: 0.0 # human LiDAR return dropout 확률
      allowed_map_types: ["lobby"] # 학습 episode에서 샘플링할 map_type 후보
      allowed_static_groups: ["small", "medium"] # 배치 허용 obstacle size group
      eval_map_types: ["lobby"]   # formal eval 시 순회할 map_type 목록
      localization_profile: clean   # no goal-obs noise yet
      # Action/control contract = base (stop-capable) for ALL stages. No stop/yield
      # REWARD fires here anyway: yield_reward/human_risk are human-gated and this
      # stage has no humans, so stages 0-2 stay pure basic-driving without any
      # per-stage action override.

    # ── Stage 1: corridor only, static — wall/lane driving (no humans/noise) ──
    - name: corridor_static
      yield_reward: {action_enabled: false}   # yield 봉인
      active_static: 3
      active_humans: 0
      human_scan_noise_std: 0.0
      human_scan_dropout_prob: 0.0
      allowed_map_types: ["corridor"]
      allowed_static_groups: ["small", "medium"]
      eval_map_types: ["corridor"]
      localization_profile: clean
      # Action/control contract = base (stop-capable); no humans → no stop/yield reward.

    # ── Stage 2: + intersection (STRUCTURE axis only). Still no humans, no noise.
    # corridor kept lighter than intersection via active_static_by_map; the single
    # active_static is the fallback for any map a by-map dict omits.
    - name: add_intersection
      yield_reward: {action_enabled: false}   # yield 봉인
      active_static: 6
      active_humans: 0
      active_static_by_map: {corridor: 3, intersection: 6} # map_type별 static 수 override
      human_scan_noise_std: 0.0
      human_scan_dropout_prob: 0.0
      allowed_map_types: ["corridor", "intersection"]
      map_type_probs: [0.5, 0.5]
      allowed_static_groups: ["small", "medium"]
      eval_map_types: ["corridor", "intersection"]
      localization_profile: clean
      # Action/control contract = base (stop-capable); no humans → no stop/yield reward.

    # ── Stage 3: + first human (DYNAMIC-AVOIDANCE axis), CLEAN observation ─
    # First pedestrians appear here — this is the FIRST-HUMAN stage, NOT an
    # action/control-contract change: the stop-capable contract is already active
    # from Stage 0, so nothing about the action semantics changes at this boundary
    # (hence no replay-buffer reset / re-warmup is needed on promotion into it).
    # Observation stays ground-truth-clean (no loc/proprio noise) so the policy
    # learns dynamic-obstacle avoidance with an UNCORRUPTED goal/state signal —
    # clean credit assignment for the avoidance behaviour. Easiest pedestrians
    # (near-straight crossing / along_path). corridor keeps just 1 human and fewer
    # static than the intersection. Human-gated stop/yield reward now activates
    # simply because humans are present (base yield_reward.enabled=true), with no
    # per-stage override.
    - name: first_human_clean
      yield_reward: {action_enabled: false}   # 첫 사람 stage도 "빠른 회피"부터 (yield 봉인)
      active_static: 6
      active_humans: 1
      active_static_by_map: {corridor: 4, intersection: 6} # corridor/intersection별 static 수
      active_humans_by_map: {corridor: 1, intersection: 1} # corridor/intersection별 human 수
      human_scan_noise_std: 0.0
      human_scan_dropout_prob: 0.0
      allowed_map_types: ["corridor", "intersection"]
      map_type_probs: [0.5, 0.5] # allowed_map_types sampling weight
      allowed_static_groups: ["small", "medium"]
      eval_map_types: ["corridor", "intersection"]
      human_mode_weights: {crossing: 1.0, along_path: 1.0, waiting: 0.0, slow_turn: 0.0} # human behavior mix
      human_social_avoid_strength: 0.3 # human-human avoidance 세기
      human_goal_span_multiplier: 1.5  # human global goal 거리 배수
      localization_profile: clean   # observation-noise introduced in Stage 4

    # ── Stage 4: SAME humans as Stage 3 + weak localization noise ────────
    # OBSERVATION-ROBUSTNESS axis: identical human/static distribution & motion to
    # Stage 3 (so nothing about the dynamic task changes); the ONLY new variable is
    # weak correlated goal-observation noise. Proprio + human-scan perception stay
    # clean — those arrive together in Stage 6.
    - name: first_human_noisy
      yield_reward: {action_enabled: false}   # yield 봉인 (마지막 봉인 stage)
      active_static: 6
      active_humans: 1
      active_static_by_map: {corridor: 4, intersection: 6} # map_type별 static 수
      active_humans_by_map: {corridor: 1, intersection: 1} # map_type별 human 수
      human_scan_noise_std: 0.0
      human_scan_dropout_prob: 0.0
      allowed_map_types: ["corridor", "intersection"]
      map_type_probs: [0.5, 0.5] # corridor/intersection sampling weight
      allowed_static_groups: ["small", "medium"]
      eval_map_types: ["corridor", "intersection"]
      human_mode_weights: {crossing: 1.0, along_path: 1.0, waiting: 0.0, slow_turn: 0.0} # behavior mix 유지
      human_social_avoid_strength: 0.3 # avoidance 세기 유지
      human_goal_span_multiplier: 1.5  # goal span 유지
      localization_profile: weak_goal_noise

    # ── Stage 5: + clutter (TERRAIN axis ONLY) ───────────────────────────
    # Adds the clutter map. EVERYTHING else is held at the Stage-4 level: human
    # count (1) + modes, weak localization noise, clean proprio + clean human-scan
    # perception. So the SINGLE new variable is the terrain (plus the LARGE static
    # group the clutter map intrinsically needs). The crowd is scaled up later, in
    # the integration stage (7) — NOT here — so terrain stays the only change.
    # corridor stays the lightest map.
    - name: add_clutter_clean
      yield_reward: {action_enabled: true}    # ← YIELD 해제 (여기부터 stop/creep 허용)
      active_static: 8
      active_humans: 1
      active_static_by_map: {corridor: 4, intersection: 6, clutter: 8} # map_type별 static 수
      active_humans_by_map: {corridor: 1, intersection: 1, clutter: 1} # map_type별 human 수
      human_scan_noise_std: 0.0
      human_scan_dropout_prob: 0.0
      allowed_map_types: ["corridor", "intersection", "clutter"]
      map_type_probs: [0.34, 0.33, 0.33] # corridor/intersection/clutter sampling weight
      allowed_static_groups: ["small", "medium", "large"]
      eval_map_types: ["corridor", "intersection", "clutter"]
      human_mode_weights: {crossing: 1.0, along_path: 1.0, waiting: 0.0, slow_turn: 0.0} # 간단한 behavior mix 유지
      human_social_avoid_strength: 0.3 # avoidance 세기 유지
      human_goal_span_multiplier: 1.5  # goal span 유지
      localization_profile: weak_goal_noise

    # ── Stage 6: SAME map/humans as Stage 5 + light proprio noise (ONLY) ─
    # PROPRIO-ROBUSTNESS axis: identical map mix, human count/modes AND human-scan
    # perception (still clean) as Stage 5; the SINGLE new variable is light
    # proprioception-observation noise. Localization noise unchanged. Human-scan
    # perception noise is deferred to the integration stage (7) so it does not
    # confound the proprio axis here.
    - name: add_clutter_noisy
      active_static: 8
      active_humans: 1
      active_static_by_map: {corridor: 4, intersection: 6, clutter: 8} # map_type별 static 수
      active_humans_by_map: {corridor: 1, intersection: 1, clutter: 1} # map_type별 human 수
      human_scan_noise_std: 0.0
      human_scan_dropout_prob: 0.0
      allowed_map_types: ["corridor", "intersection", "clutter"]
      map_type_probs: [0.34, 0.33, 0.33] # map sampling weight
      allowed_static_groups: ["small", "medium", "large"]
      eval_map_types: ["corridor", "intersection", "clutter"]
      human_mode_weights: {crossing: 1.0, along_path: 1.0, waiting: 0.0, slow_turn: 0.0} # behavior mix 유지
      human_social_avoid_strength: 0.3 # avoidance 세기 유지
      human_goal_span_multiplier: 1.5  # goal span 유지
      localization_profile: weak_goal_noise
      proprio_noise_profile: light # named proprio noise profile selector

    # ── Stage 7: +lobby map + FIRST human-scan noise + modest crowd (1->3) ──
    # First half of the old single integration stage. Adds the 4th map (lobby),
    # weak human-scan noise/dropout (FIRST perception noise) AND a small crowd bump
    # (1 -> 3) — so NOT strictly single-axis, but much lighter than the old jump.
    # Localization stays weak (Stage 5/6 level, NOT drift yet), human modes stay
    # simple, proprio stays light — those scale in Stage 8.
    - name: add_lobby
      active_static: 8
      active_humans: 3
      active_static_by_map: {corridor: 4, intersection: 6, clutter: 8, lobby: 8} # map_type별 static 수
      active_humans_by_map: {corridor: 1, intersection: 2, clutter: 2, lobby: 3} # map_type별 human 수 (modest)
      human_scan_noise_std: 0.03     # FIRST human-scan perception noise (weak)
      human_scan_dropout_prob: 0.015
      allowed_map_types: ["lobby", "corridor", "intersection", "clutter"]
      map_type_probs: [0.25, 0.25, 0.25, 0.25] # 4개 map 균등 sampling
      allowed_static_groups: ["small", "medium", "large"]
      eval_map_types: ["lobby", "corridor", "intersection", "clutter"]
      human_mode_weights: {crossing: 1.0, along_path: 1.0, waiting: 0.0, slow_turn: 0.0} # 간단 mix 유지
      human_social_avoid_strength: 0.3 # avoidance 세기 유지
      human_goal_span_multiplier: 1.5  # goal span 유지
      localization_profile: weak_goal_noise # loc noise는 Stage 5/6 수준 유지
      proprio_noise_profile: light # light proprio 유지

    # ── Stage 8: INTEGRATION — scale crowd (3->5) + richer modes + drift loc-noise.
    # Second half of the old integration stage. Holds the Stage-7 map mix + scan
    # noise, and adds the crowd-scale + behaviour-richness + mid (drift)
    # localization-noise axes together (these belong to one "busier crowd" step).
    - name: scale_crowd
      active_static: 8
      active_humans: 5
      active_static_by_map: {corridor: 5, intersection: 7, clutter: 8, lobby: 8} # map_type별 static 수
      active_humans_by_map: {corridor: 2, intersection: 3, clutter: 4, lobby: 5} # map_type별 human 수
      human_scan_noise_std: 0.045
      human_scan_dropout_prob: 0.025
      allowed_map_types: ["lobby", "corridor", "intersection", "clutter"]
      map_type_probs: [0.25, 0.25, 0.25, 0.25] # 4개 map 균등 sampling
      allowed_static_groups: ["small", "medium", "large"]
      eval_map_types: ["lobby", "corridor", "intersection", "clutter"]
      human_mode_weights: {crossing: 1.0, along_path: 1.0, waiting: 0.5, slow_turn: 0.75} # richer human behavior mix
      human_social_avoid_strength: 0.6 # avoidance 세기 증가
      human_goal_span_multiplier: 2.0  # 더 긴 human goal span
      localization_profile: drift_goal_noise # mid (drift) localization noise 도입
      proprio_noise_profile: light # light proprio profile 유지

    # ── Stage 9: FINAL — full crowd + full behaviour mix + strongest TRAIN noise.
    # corridor remains lighter (static 5 / humans 3) than the open maps even at
    # full difficulty.
    - name: full_complexity
      active_static: 9
      active_humans: 7
      active_static_by_map: {corridor: 5, intersection: 7, clutter: 8, lobby: 9} # map_type별 최종 static 수
      active_humans_by_map: {corridor: 3, intersection: 4, clutter: 4, lobby: 6} # map_type별 최종 human 수
      human_scan_noise_std: 0.06
      human_scan_dropout_prob: 0.04
      allowed_map_types: ["lobby", "corridor", "intersection", "clutter"]
      # Slightly de-emphasize the hardest maps during final-stage training to
      # reduce collapse from dynamic crowd density while keeping all four maps active.
      map_type_probs: [0.30, 0.30, 0.20, 0.20]
      allowed_static_groups: ["small", "medium", "large"]
      eval_map_types: ["lobby", "corridor", "intersection", "clutter"]
      # full behaviour mix (all four modes)
      human_mode_weights: {crossing: 1.0, along_path: 1.0, waiting: 1.0, slow_turn: 1.0} # full behavior mix
      # Falcon-lite: stronger avoidance + longer goal spans -> busier crowd
      human_social_avoid_strength: 0.8 # strongest avoidance blend
      human_social_avoid_radius: 1.8   # avoidance가 작동하는 neighbor radius
      human_social_avoid_max_heading_offset_deg: 35.0 # avoidance로 허용할 최대 heading offset
      human_goal_span_multiplier: 2.5  # 가장 긴 human goal span
      # hardest TRAIN localization: full correlated noise + bias + drift + delay
      # + RARE small/big relocalization jumps. NO yaw flip in training — the ±π
      # mirror flip lives only in the `stress_eval` profile (evaluation-only).
      localization_profile: robustness_train # hardest training localization profile
      # slightly stronger proprio-observation noise + bias + 1-step delay.
      proprio_noise_profile: medium # strongest training proprio profile
