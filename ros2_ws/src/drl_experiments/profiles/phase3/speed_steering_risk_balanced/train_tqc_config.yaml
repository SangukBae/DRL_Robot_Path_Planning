train_settings:
  seed: 0
  deterministic_torch: true
  deterministic_warn_only: true
  max_episode_steps: 600
  max_timesteps: 2000000
  load_model: false
  use_checkpoints: false
  eval_freq: 12000
  # One 40-episode evaluation per promotion decision. This preserves the old
  # 20-episode × 2-consecutive protocol's total evaluation sample count while
  # removing the extra 12k-step confirmation delay. It also gives exactly
  # 10 episodes/map in four-map stages, making per-map gates interpretable.
  eval_eps: 40
  timesteps_before_training: 12000
  updates_per_env_step: 1
  base_file_name: tqc_phase3_speed_steering_risk_balanced
