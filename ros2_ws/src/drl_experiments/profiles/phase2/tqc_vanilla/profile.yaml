# PHASE2 experiment profile: tqc_vanilla
# Loaded by drl_agent.config.loader (ProfileLoader). File paths are relative
# to this directory. Flags below must MATCH the yaml contents — validated by
# drl_agent.config.validation before training starts.
#
# "Pure TQC": every training-time model extension beyond the actor + TQC
# quantile critic is OFF, on BOTH the env side and the agent side --
# aux_prediction (shared encoder + future-risk aux head), observation_time_
# context (scan-history frame stacking), risk_map_reward / action_risk_head /
# critic_risk_input (PHASE2 candidate1/2), continuous_control_reward
# (speed_steering-only, inert here), directional_risk.waypoint_trajectory_risk_enabled, and
# replay_buffer.risk_meta / risk_balanced_sampling. The action contract
# (waypoint_yield, action_dim=3), 10-stage curriculum, map/human/reward
# configuration are otherwise IDENTICAL to phase2/baseline.
profile:
  name: phase2/tqc_vanilla
  algorithm: tqc
  trainer: curriculum
  environment: environment_curriculum.yaml
  train: train_tqc_config.yaml
  hparams: hyperparameters_tqc.yaml
  curriculum: train_tqc_curriculum_config.yaml
  output_prefix: tqc_phase2_vanilla
  overrides:
    risk_map_reward_enabled: false      # env-side reward shaping (candidate1)
    action_risk_head_enabled: false     # env+agent action-risk head (candidate2)
