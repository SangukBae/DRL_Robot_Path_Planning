# PHASE2 experiment profile: both_legacy
# Reproduces the pre trajectory-risk / risk-balanced-sampling "both" profile
# used by the 20260728_123658_tqc_phase2_both_seed0 run. The model features
# are risk_map_reward + action_risk_head + critic_risk_input only.
profile:
  name: phase2/both_legacy
  algorithm: tqc
  trainer: curriculum
  environment: environment_curriculum.yaml
  train: train_tqc_config.yaml
  hparams: hyperparameters_tqc.yaml
  curriculum: train_tqc_curriculum_config.yaml
  output_prefix: tqc_phase2_both_legacy
  overrides:
    risk_map_reward_enabled: true
    action_risk_head_enabled: true
